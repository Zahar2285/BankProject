[project]
name = "pythonproject2"
version = "0.1.0"
description = ""
authors = [
    {name = "Alexandr",email = "Zahar2285@mail.ru"}
]
python = ">=3.11,<3.14"
dependencies = [
    "autopep8 (>=2.3.2,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 119
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true


[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=1.16.1)"
]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (<1.18)",
    "isort (>=8.0.1,<9.0.0)"
]

[tool.poetry]
name = "pythonproject2"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"

